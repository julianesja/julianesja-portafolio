name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar variables de entorno
        run: |
          echo "Verificando variables de entorno en GitHub Actions:"
          if [ -n "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "✅ VITE_FIREBASE_PROJECT_ID está configurada ($VITE_FIREBASE_PROJECT_ID)"
          else
            echo "❌ VITE_FIREBASE_PROJECT_ID ESTÁ VACÍA / NO EXISTE"
          fi
          if [ -n "$VITE_FIREBASE_API_KEY" ]; then
            echo "✅ VITE_FIREBASE_API_KEY está configurada (Longitud: ${#VITE_FIREBASE_API_KEY} caracteres)"
          else
            echo "❌ VITE_FIREBASE_API_KEY ESTÁ VACÍA / NO EXISTE"
          fi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JULIANESJA_DA579 }}
          channelId: live
          projectId: julianesja-da579
